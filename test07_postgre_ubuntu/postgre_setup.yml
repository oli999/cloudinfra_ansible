# postgre_setup.yml

---
- name: Postgre 설치 및 셋업 (Ubuntu Linux 전용)
  hosts: aws_ubuntu
  become: yes

  # 환경변수설정 (생성할 db 의 이름, 계정, 비밀번호 등을 제어 합니다)
  vars:
    db_name: "scott_db"
    db_user: "scott"
    db_pass: "tiger"
    pg_version: "16" # Ubuntu 24.04의 기본 PostgreSQL 버전
    pg_conf_path: "/etc/postgresql/{{ pg_version }}/main/postgresql.conf"
    pg_hba_path: "/etc/postgresql/{{ pg_version }}/main/pg_hba.conf"    

  tasks:
    - name: 1. 필수 페키지 설치
      apt:
        name:
          - postgresql # postgre 본체
          - postgresql-contrib # 확장기능 contibution  
          - python3-psycopg2 # ansible 이 DB 를 제어하기 위한 라이브러리 
          - acl # ubuntu 에서 become_user: postgres 전환시 에러 방지용 페키지 
        state: present
        update_cache: yes
    
    # ubuntu 에서 apt 로 설치시 DB 를 자동으로 초기화 하고 서비스를 시작 하기 때문에 아래는 주석처리
    # - name: 2. DB 초기화 
    #   command: postgresql-setup --initdb
    #   args:
    #     creates: "{{ pg_data_dir }}/PG_VERSION" # 이 파일이 있으면 initdb 를 실행하지 않음
    
    - name: 2. 외부 접속 허용 (listen_addresses) # 이런 설정정보를 변경하면 db 를 restart 해야 적용된다.
      lineinfile:
        # 아래 경로에 있는 설정 파일에서 
        path: "{{ pg_conf_path }}"
        #  #listen_addresses 또는   listen_addresses 로 시작하는 line 을 찾아서 
        regexp: "^#?listen_addresses"
        # 아래의 문자열로 대체 하기 
        line: "listen_addresses = '*'"
        state: present
      notify: restart_postgre # restart_postgre 이벤트를 발생시킨다 (위의 작업에 의해 변화가 있을때)

    - name: "3. postgresql.conf 패스워드 암호화 방식 md5로 강제 지정"
      lineinfile:
        path: "{{ pg_conf_path }}"
        regexp: "^#?password_encryption"
        line: "password_encryption = md5"
        state: present
      # 설정이 변경되었을때 restart_postgre 핸들러를 호출해서 postgres 가 재시작 되도록 한다. 
      notify: restart_postgre

    - name: 4. locahost 에서 비밀번호로 접속 할수 있게 허용
      replace:
        path: "{{ pg_hba_path }}"
        regexp: '^(host\s+all\s+all\s+(127\.0\.0\.1\/32|::1\/128)\s+)(ident|scram-sha-256|trust|peer)$'
        replace: '\1md5'
      notify: restart_postgre

    - name: 5. 외부 아이피 대역  (0.0.0.0/0) md5 접속 허용 룰 추가
      lineinfile:
        path: "{{ pg_hba_path }}"
        line: "host     all     all     0.0.0.0/0     md5"
        insertafter: EOF # 파일의 맨마지막 다음에 추가 하겠다는 의미
      notify: restart_postgre

    - name: 6. postgre 서비스 시작 및 재부팅시 자동 실행 설정
      systemd:
        name: postgresql
        state: started
        enabled: yes

    # OS의 'postgres' 계정으로 전환 (acl 패키지가 있어야 에러가 안 납니다)
    - name: 7. 사용자 계정 생성 및 비밀번호 부여
      postgresql_user:
        name: "{{ db_user }}"
        password: "{{ db_pass }}"
      become: yes
      become_user: postgres # 관리자 계정으로 scott/tiger 계정을 생성한다 

    - name: 8. 신규 db 생성 및 소유권 부여
      postgresql_db:
        name: "{{ db_name }}"
        owner: "{{ db_user }}"
      become: yes
      become_user: postgres

    # 설치 직후에는 비밀번호가 설정되어 있지 않아서 비밀번호 접속을 하려면 설정해야 한다.
    - name: 9. postgres 슈퍼 유저 비밀번호 설정  
      postgresql_user:
        name: postgres
        password: "postgres"
      become: yes
      become_user: postgres

  # 특정 이벤트가 발생했을때 작업할 내용은  handlers: 에 명시해 놓으면 된다. 
  handlers:
    - name: restart_postgre # 여기에 작성한 이름이 이벤트명이 된다. 
      systemd:
        name: postgresql
        state: restarted