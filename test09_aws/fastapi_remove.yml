# fastapi_remove.yml
---
- name: fastapi 듀얼 포트 서비스 및 앱 제거 (8000, 8001)
  hosts: aws_amazon
  become: yes

  vars:
    app_dir: "/opt/fastapi_app"
    app_ports: [8000, 8001]

  tasks:
    - name: 1. 실행 중인 systemd 서비스 중지 및 부팅 자동 실행 해제
      systemd:
        name: "fastapi_{{ item }}"
        state: stopped
        enabled: no
      loop: "{{ app_ports }}"
      ignore_errors: yes  # 이미 중지되었거나 삭제된 서비스여도 에러 없이 통과

    - name: 2. systemd 서비스 유닛 파일 삭제 (8000, 8001 각각)
      file:
        path: "/etc/systemd/system/fastapi_{{ item }}.service"
        state: absent
      loop: "{{ app_ports }}"

    - name: 3. systemd 데몬 설정 리로드 (삭제된 서비스 반영)
      systemd:
        daemon_reload: yes

    - name: 4. 앱 및 가상환경 디렉토리(/opt/fastapi_app) 전체 삭제
      file:
        path: "{{ app_dir }}"
        state: absent

