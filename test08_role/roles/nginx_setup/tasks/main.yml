
# roles/nginx_setup/tasks/main.yml

- name: nginx 설치
  # dnf, apt 를 사용하는것이 아닌 package 모듈을 이용하면 된다 
  package:
    name: nginx
    state: present 

- name: 서비스 시작
  service:
    name: nginx
    state: started
    enabled: yes

- name: rocky index.html 템플릿 배포
  template: 
    src: index.html
    dest: "{{ rocky_web_root }}/index.html"
    mode: "0644"
  when: ansible_distribution == 'Rocky'

- name: ubuntu index.html 템플릿 배포
  template: 
    src: index.html
    dest: "{{ ubuntu_web_root }}/index.html"
    mode: "0644"
  when: ansible_distribution == 'Ubuntu'

- name: rocky 방화벽 해제
  service:
    name: "{{ rocky_fw_service }}"
    state: stopped
    enabled: no
  when: ansible_distribution == 'Rocky'

- name: ubuntu 방화벽 해제
  service:
    name: "{{ ubuntu_fw_service }}"
    state: stopped
    enabled: no
  when: ansible_distribution == 'Ubuntu'
